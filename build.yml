name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o N7-SENSI.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: src/N7ELITE
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: N7ELITE-apk
          path: src/N7ELITE/app/build/outputs/apk/debug/app-debug.apk
